<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Module 4 - HTML Tables</title>
    <style>
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: left;
        }
        th {
            background-color: #4CAF50;
            color: white;
        }
    </style>
</head>
<body>
    <h1>Module 4: HTML Tables</h1>
    <p>Here is a weekly schedule table built using HTML tags like <code>&lt;table&gt;</code>, <code>&lt;tr&gt;</code>, and <code>&lt;td&gt;</code>.</p>

    <table>
        <tr>
            <th>Day</th>
            <th>Subject</th>
            <th>Topic</th>
        </tr>
        <tr>
            <td>Monday</td>
            <td>HTML Basics</td>
            <td>Structure and Headings</td>
        </tr>
        <tr>
            <td>Tuesday</td>
            <td>HTML Advanced</td>
            <td>Links, Images, and Navigation</td>
        </tr>
        <tr>
            <td>Wednesday</td>
            <td>HTML Tables</td>
            <td>Rows, Columns, and Styling</td>
        </tr>
    </table>

    <p style="margin-top: 20px;"><a href="../module-3/index.html">Back to Module 3</a></p>
</body>
</html>
