<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Module 7 - CSS Flexbox</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background-color: #f4f6f8;
        }

        h1 {
            color: #2d3748;
        }

        /* Flexbox Container */
        .flex-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #cbd5e0;
            padding: 20px;
            border-radius: 8px;
            margin-top: 20px;
        }

        /* Flexbox Items */
        .flex-item {
            background-color: #3182ce;
            color: white;
            padding: 20px;
            width: 28%;
            text-align: center;
            border-radius: 6px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h1>Module 7: CSS Flexbox</h1>
    <p>Flexbox is a one-dimensional layout method designed for arranging items in rows or columns with ease.</p>

    <!-- Flexbox Container -->
    <div class="flex-container">
        <div class="flex-item">Item 1</div>
        <div class="flex-item">Item 2</div>
        <div class="flex-item">Item 3</div>
    </div>

    <p style="margin-top: 30px;"><a href="../module-6/index.html">&larr; Back to Module 6</a></p>

</body>
</html>
