<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Module 5 - CSS Fundamentals</title>
    <style>
        /* Element Selector */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            margin: 40px;
        }

        /* Class Selector */
        .card {
            background-color: white;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            max-width: 500px;
            margin-bottom: 20px;
        }

        /* ID Selector */
        #main-heading {
            color: #2c3e50;
            border-bottom: 2px solid #3498db;
            padding-bottom: 10px;
        }

        .highlight {
            color: #e74c3c;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1 id="main-heading">Module 5: CSS Fundamentals</h1>
        <p>Cascading Style Sheets (CSS) are used to style and layout web pages—such as changing fonts, colors, and spacing.</p>
        <p>We use <span class="highlight">selectors</span> like elements, classes, and IDs to target specific HTML tags.</p>
    </div>

    <p><a href="../module-4/index.html">&larr; Back to Module 4</a></p>

</body>
</html>
